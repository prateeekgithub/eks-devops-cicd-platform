name: EKS DevOps CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  docker-build-push-deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build Docker Image
      run: |
        docker build -t prateek-frontend:v1 ./app

    - name: Tag Docker Image
      run: |
        docker tag prateek-frontend:v1 \
        411025836491.dkr.ecr.ap-south-1.amazonaws.com/prateek-frontend:v1

    - name: Push Image to ECR
      run: |
        docker push \
        411025836491.dkr.ecr.ap-south-1.amazonaws.com/prateek-frontend:v1

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --region ap-south-1 --name eks-devops-cluster

    - name: Deploy to EKS
      run: |
        kubectl apply -f k8s/deployment.yaml
        kubectl apply -f k8s/service.yaml
